; Default Compact CHI CPU-core fixture: L1D, L1I, PTW and MMIO.
; TL-C slot 0 is L1D; TL-UL slot 0 is L1I and slot 1 is PTW.
[tltest.logger]
verbose = 1

[tltest.config]
core = 1
core.tl_c = 1
core.tl_ul = 2
startup.cycle = 0
maximum_cycle = 12000
memory.enable = 1
memory.start = 4096
memory.end = 2097152
memory.backend.port.count = 1
memory.backend.rd.depth = 16
memory.backend.rd.latency = 4
memory.backend.wr.depth = 8
memory.backend.wr.latency = 4
memory.backend.cycle_unit = 1
mmio.enable = 1
mmio.start = 2097152
mmio.end = 2101248
cmo.enable = 1
cmo.start = 4096
cmo.end = 2097152

[tltest.fuzzer]
ari.interval = 20
ari.target = 1
stream.interval = 20
stream.step = 64
stream.start = 4096
stream.end = 8192

[tltest.sequence]
mode.0 = fuzz_stream
mode.1 = fuzz_stream
mode.2 = fuzz_stream
mode.3 = fuzz_stream
