; Bounded seeded serialized action segments. Cache RTL is unchanged.
[tltest.config]
core = 2
core.tl_c = 1
core.tl_ul = 1
startup.cycle = 0
maximum_cycle = 100000
memory.enable = 1
memory.start = 4096
memory.end = 262144
memory.backend.port.count = 1
memory.backend.rd.depth = 16
memory.backend.rd.latency = 4
memory.backend.wr.depth = 8
memory.backend.wr.latency = 4
memory.backend.cycle_unit = 1
mmio.enable = 1
mmio.start = 262144
mmio.end = 266240
cmo.enable = 1
cmo.enable.cbo.clean = 1
cmo.enable.cbo.flush = 1
cmo.enable.cbo.inval = 1
cmo.start = 4096
cmo.end = 262144

[tltest.fuzzer]
random.episodes = 32
random.lines = 4

[tltest.sequence]
mode.0 = random_actions
