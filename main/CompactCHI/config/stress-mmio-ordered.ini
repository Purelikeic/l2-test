; Sustained traffic with ordered MMIO (Order=2): concurrent lanes stress the global ReadReceipt block.
[tltest.config]
core = 2
core.tl_c = 2
core.tl_ul = 1
startup.cycle = 0
maximum_cycle = 60000
memory.enable = 1
memory.start = 4096
memory.end = 33554432
memory.backend.ooor = 1
memory.backend.port.count = 1
memory.backend.rd.depth = 16
memory.backend.rd.latency = 32
memory.backend.wr.depth = 8
memory.backend.wr.latency = 16
memory.backend.cycle_unit = 1
mmio.enable = 1
mmio.start = 33554432
mmio.end = 33619968
mmio.order = 2
cmo.enable = 1
cmo.start = 4096
cmo.end = 33554432

[tltest.stress]
pattern = stream
cycles = 20000
lanes = 16
outstanding = 16
